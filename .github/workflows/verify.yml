name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run verify
      # The release archives are built with GNU tar and Info-ZIP, so the
      # byte-for-byte release checks run on Linux only.
      - if: runner.os == 'Linux'
        run: bun run build:release
      - if: runner.os == 'Linux'
        run: bun run verify:release
      - if: runner.os == 'Linux'
        run: git diff --exit-code -- runtime/ platforms/
